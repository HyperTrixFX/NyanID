<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="email code">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<table cellpadding="0" align="center"
       style="width: 800px; margin: 0 auto; text-align: left; border-radius: 5px; font-size: 14px; font-family: 微软雅黑, 黑体; line-height: 1.5; box-shadow: #999 0 0 5px; border-collapse: collapse; background: #fff;">
    <tbody>
    <tr>
        <th valign="middle"
            style="height: 25px; line-height: 25px; padding: 15px 35px; border-bottom: 1px solid #1dd8e2; background: #1183cf; border-radius: 5px 5px 0 0;">
            <font face="微软雅黑" size="5" style="color: #fff;">${emailTitle}</font>
        </th>
    </tr>
    <tr>
        <td style="word-break: break-all">
            <div style="padding: 25px 35px 40px; background-color: #fff; opacity: 0.8;">
                <h2 style="margin: 5px 0;">
                    <font color="#333" style="line-height: 22px;" size="4">
                        ${greetingPrefix}${user}
                    </font>
                </h2>
                ${bodyContent}
                <div style="width: 100%; margin: 0 auto;">
                    <div style="padding: 10px 10px 0; border-top: 1px solid #ccc; color: #747474; margin-bottom: 20px; line-height: 1.3; font-size: 12px;">
                        <p>${teamName}</p>
                        <p>${contactUs}: ${contact}</p>
                        <p>${doNotReply}</p>
                    </div>
                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
