# 应用基础配置
spring.application.name=NyanID
spring.config.location=classpath:config/*
spring.web.error.path=/error

# 静态资源与 Web 配置
# 禁用静态资源映射（不提供静态文件服务）
spring.web.resources.add-mappings=false

# 日志配置
# 控制台日志格式
spring.output.ansi.enabled=always
logging.pattern.console=[%highlight(%d{yyyy-MM-dd HH:mm:ss.SSS})] [%highlight(%thread)] [%highlight(%p)] %clr(-){cyan} %msg%n
# 文件日志格式（未启用文件输出，可忽略）
# logging.pattern.file=[%d{yyyy-MM-dd HH:mm:ss}] [%p] - %msg%n

# 屏蔽 Spring MVC 对静态资源请求的 WARN 日志
logging.level.org.springframework.web.servlet.DispatcherServlet=ERROR
logging.level.org.springframework.web.servlet=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# 业务包日志级别（开发环境DEBUG，生产环境INFO）
logging.level.moe.koseirin.nyanruaineo.Minecraft=INFO

# 其他第三方库日志级别
logging.level.org.quartz.core.QuartzScheduler=WARN
logging.level.org.hibernate=WARN
logging.level.io.netty=ERROR
logging.level.io.lettuce.core=ERROR
logging.level.io.github.kloping.qqbot=ERROR

# 错误处理配置
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.whitelabel.enabled=false

# JPA / 数据库配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=none

# HikariCP 连接池配置
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=5000

# 邮件配置
spring.mail.properties.ssl.trust-all-certs=true

# 开发工具（DevTools）
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

#=======TOMCAT=========
# --- HTTP 压缩 ---
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,application/json,application/javascript,text/css
server.compression.min-response-size=1024
# --- 禁用 JSP（如不需要） ---
server.servlet.jsp.registered=false
# --- 连接器 ---
# 最大连接数
server.tomcat.max-connections=8192
# 当所有线程忙时，允许排队等待的连接数
server.tomcat.accept-count=100
# 连接超时时间（毫秒）
server.tomcat.connection-timeout=20000
# --- 字符编码 ---
server.tomcat.uri-encoding=UTF-8
# --- 请求体大小限制 ---
# POST 表单最大大小
server.tomcat.max-http-form-post-size=2MB
# 请求体最大可被“吞下”的大小
server.tomcat.max-swallow-size=2MB